services:
  database:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: safe_route
      POSTGRES_USER: safe_route
      POSTGRES_PASSWORD: safe_route_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe_route -d safe_route"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - safe-route-postgres-data:/var/lib/postgresql/data

volumes:
  safe-route-postgres-data:
