services:
  test-db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: safe_route_test
      POSTGRES_USER: safe_route_test
      POSTGRES_PASSWORD: safe_route_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe_route_test -d safe_route_test"]
      interval: 2s
      timeout: 3s
      retries: 20
